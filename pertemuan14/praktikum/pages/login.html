<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../src/output.css" rel="stylesheet">
</head>
<body>
  <div class="text-5xl bg-blue-500 text-white text-center p-4 font-serif">
    <h1>Login</h1>
  </div>
  <div class="h-96 flex items-center justify-center">
    <div class="max-w-sm w-full p-4 border border-gray-300 rounded-md"> 
        <div class="mb-10">
            <h1 class="text-center font-bold text-2xl mb-5 text-blue-500">Login Masss</h1>
        </div>
        <form class="space-y-6">
          <!-- Floating Label Input -->
          <div class="relative">
            <input
              type="text"
              id="floating-name"
              class="peer w-full px-3 pt-5 pb-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder=" "
            />
            <label
              for="floating-name"
                class="absolute left-3 top-1 text-gray-500 text-sm transition-all transform scale-100 peer-placeholder-shown:translate-y-3 peer-focus:scale-90 peer-focus:-translate-y-1 peer-focus:text-blue-500"
            >
              Name
            </label>
          </div>
    
          <!-- Floating Label Input -->
          <div class="relative">
            <input
              type="password"
              id="floating-password"
              class="peer w-full px-3 pt-5 pb-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
              placeholder=" "
            />
            <label
              for="floating-password"
              class="absolute left-3 top-2 text-gray-500 text-sm transition-all transform scale-100 peer-placeholder-shown:translate-y-3 peer-placeholder-shown:scale-100 peer-placeholder-shown:text-gray-400 peer-focus:scale-90 peer-focus:-translate-y-1 peer-focus:text-blue-500"
            >
              Password
            </label>
          </div>
    
          <button
            type="submit"
            class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 focus:ring-2 focus:ring-blue-500"
          >
            Login
          </button>
        </form>
    </div>
  </div>
</body>
</html>
